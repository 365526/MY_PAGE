<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>김소희 자기소개</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>안녕하세요, 김소희입니다🧑🏻‍💻</h1>
    <button id="theme-btn">🌙 다크모드</button>
  </header>

<main class="cards">
  <!-- 카드 1 · 프로필 -->
  <article class="card">
    <img src="https://placehold.co/120" alt="프로필 사진">
    <h2>김소희</h2>
    <p class="role">석사과정 · 정보영재트랙</p>
    <p>파견연구교사로<br>2학기 재학 중입니다.</p>
  </article>

  <!-- 카드 2 · 관심 연구 주제 -->
  <article class="card">
    <div class="card-icon">🎓</div>
    <h2>관심 연구 주제</h2>
    <p class="role">AI 융합 교육</p>
    <p class="list">
      • 인공지능과 교육<br>
      • 교육 데이터 분석<br>
      • 교육용 SW 개발
    </p>
  </article>

  <!-- 카드 3 · 학기 프로젝트 -->
  <article class="card">
    <div class="card-icon">🗺️</div>
    <h2>학기 프로젝트</h2>
    <p class="role">AI 기반 개발 실습</p>
    <p>관광 공공데이터를 활용한<br><strong>여행 계획 프로그램 개발</strong></p>
  </article>

  <!-- 카드 4 · 이번 학기 목표 -->
  <article class="card">
    <div class="card-icon">🎯</div>
    <h2>이번 학기 목표</h2>
    <p class="role">연구 준비</p>
    <p>선행연구 분석을 통한<br><strong>논문 주제 구체화</strong></p>
  </article>

</main>

  <footer>
    <p>정보영재교수학습프로그램개발 과제</p>
    <p>© 2026 김소희</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>

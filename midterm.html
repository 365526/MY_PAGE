<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>중간발표 자료</title>
  <style>
    body { margin: 0; background: #111; color: #fff; font-family: sans-serif;
           display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    header { width: 100%; max-width: 1100px; padding: 1rem; display: flex; justify-content: space-between; }
    header a { color: #93c5fd; text-decoration: none; }
    #slide { width: 95%; max-width: 1100px; border-radius: 6px; }
    nav { margin: 1rem; display: flex; gap: 1rem; align-items: center; }
    button { padding: .5rem 1.2rem; font-size: 1rem; border: none; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>
  <header>
    <a href="index.html">← 자기소개로 돌아가기</a>
    <span>중간발표</span>
  </header>
  <img id="slide" alt="발표 슬라이드">
  <nav>
    <button id="prev">이전</button>
    <span id="count"></span>
    <button id="next">다음</button>
  </nav>
  <script>
    const TOTAL = 3;                       // 슬라이드 장수로 수정
    const path = n => `slides/midterm/${String(n).padStart(2, '0')}.png`;
    let cur = 1;
    const img = document.getElementById('slide');
    const count = document.getElementById('count');
    function show(n) {
      cur = Math.min(Math.max(n, 1), TOTAL);
      img.src = path(cur);
      count.textContent = `${cur} / ${TOTAL}`;
    }
    document.getElementById('prev').onclick = () => show(cur - 1);
    document.getElementById('next').onclick = () => show(cur + 1);
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft') show(cur - 1);
      if (e.key === 'ArrowRight') show(cur + 1);
    });
    show(1);
  </script>
</body>
</html>
